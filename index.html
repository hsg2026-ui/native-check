<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Native Check</title>
<meta name="theme-color" content="#0E6170" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Native Check">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Layout: one-column phone app, a proofreader's desk: your text is set like a manuscript, marks sit under the words, tab bar at the thumb. */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --sunk:#E8ECEE; --ink:#151D24; --muted:#5A6672; --line:#D6DDE2;
  --accent:#0E6170; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
  --err:#C0392B; --err-soft:#FBE4E1; --unn:#A86A0C; --unn-soft:#FBEFD9; --upg:#2B7A4B; --upg-soft:#E0F2E7;
  --spk:#6B44B8; --spk-soft:#ECE5F8;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0E1316; --surface:#161E23; --sunk:#1D272D; --ink:#E5EAED; --muted:#93A0AA; --line:#28343B;
  --accent:#58B7C4; --accent-ink:#0B1A1D; --accent-soft:#16343A;
  --err:#F0786C; --err-soft:#3A1E1C; --unn:#E8B451; --unn-soft:#352915; --upg:#62C48D; --upg-soft:#173022;
  --spk:#B79AF0; --spk-soft:#2B2340; color-scheme:dark }}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:14px 8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
h2{font-size:1.45rem;line-height:1.2}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.err{background:var(--err-soft);color:var(--err)} .chip.unn{background:var(--unn-soft);color:var(--unn)} .chip.upg{background:var(--upg-soft);color:var(--upg)} .chip.spk{background:var(--spk-soft);color:var(--spk)}
.banner{background:var(--unn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.level{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.iconbtn{border:0;background:var(--sunk);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
ol.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* practice */
.task{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.task .t{font-family:var(--f-display);font-size:1.12rem;line-height:1.4}
.scen{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scen::-webkit-scrollbar{display:none}
.scen button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.85rem;white-space:nowrap}
.scen button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);
  padding:14px;font-family:var(--f-display);font-size:1.08rem;line-height:1.6}
.recorder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.recbtn{width:92px;height:92px;border-radius:50%;border:0;background:var(--err);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 0 color-mix(in srgb,var(--err) 40%,transparent);transition:box-shadow .15s}
.recbtn svg{width:38px;height:38px}
.recbtn.live{background:var(--ink);color:var(--bg)}
.timer{font-variant-numeric:tabular-nums;font-size:1.6rem;font-family:var(--f-display);font-weight:600}
.meter{width:100%;max-width:280px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--err);transition:width .08s}
.hist{display:flex;flex-direction:column}
.hist button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.hist button:first-child{border-top:0}
.hist .ex{font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hist .meta{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}

/* feedback */
.manuscript{font-family:var(--f-display);font-size:1.14rem;line-height:2.05;white-space:pre-wrap;overflow-wrap:anywhere}
.mk{cursor:pointer;border-radius:3px;padding:1px 1px;text-decoration-thickness:2px;text-underline-offset:5px}
.mk.err{text-decoration:underline wavy var(--err);background:var(--err-soft)}
.mk.unn{text-decoration:underline dotted var(--unn);text-decoration-thickness:3px;background:var(--unn-soft)}
.mk.upg{text-decoration:underline dashed var(--upg);background:var(--upg-soft)}
.mk.spk{text-decoration:underline double var(--spk);background:var(--spk-soft)}
.mk.off{background:transparent;text-decoration:line-through var(--muted);color:var(--muted)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.ilist{display:flex;flex-direction:column}
.irow{all:unset;cursor:pointer;display:grid;grid-template-columns:10px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.err{background:var(--err)} .dot.unn{background:var(--unn)} .dot.upg{background:var(--upg)} .dot.spk{background:var(--spk)} .dot.off{background:var(--line)}
.irow .fix{font-family:var(--f-display);min-width:0;overflow-wrap:anywhere}
.irow .fix s{color:var(--muted)}
.irow .pat{font-size:.78rem;color:var(--muted)}
.verdict{font-family:var(--f-display);font-size:1.05rem;line-height:1.5}
details.native summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none}
details.native summary::-webkit-details-marker{display:none}
details.native p{font-family:var(--f-display);font-size:1.06rem;line-height:1.65;margin-top:10px;white-space:pre-wrap}
.ok{display:flex;gap:10px;align-items:center;color:var(--upg);font-weight:600}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score{background:var(--spk-soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.score b{font-family:var(--f-display);font-size:1.5rem;color:var(--spk);font-variant-numeric:tabular-nums;line-height:1.1}
.score span{font-size:.74rem;color:var(--muted)}
.ipa{font-family:"Doulos SIL","Charis SIL","Lucida Sans Unicode","Arial Unicode MS",var(--f-display)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:84vh;overflow-y:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheet .in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.fixline{font-family:var(--f-display);font-size:1.2rem;line-height:1.5;overflow-wrap:anywhere}
.fixline s{color:var(--muted);text-decoration-color:var(--err)}
.fixline b{color:var(--upg)}
.box{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.box .eyebrow{font-size:.68rem}
.alt{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.92rem;align-items:baseline}
.alt i{font-family:var(--f-display);font-style:italic;font-size:1rem}
.answer{font-size:.92rem;white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:10px}

/* collection */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.76rem;color:var(--muted)}
.phr{display:flex;flex-direction:column;gap:4px;padding:13px 0;border-top:1px solid var(--line)}
.phr:first-child{border-top:0}
.phr .p{font-family:var(--f-display);font-weight:700;font-size:1.08rem}
.phr .ex{font-family:var(--f-display);font-style:italic;color:var(--muted)}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--accent)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:.8rem;padding:2px 0;text-decoration:underline}
.linkbtn.danger{color:var(--err)}
.idiom{border:1.5px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.idiom .p{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.idiom .ex{font-family:var(--f-display);font-style:italic}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.heat{display:grid;grid-template-columns:auto repeat(8,1fr);gap:4px;font-size:.68rem;color:var(--muted);align-items:center}
.heat i{aspect-ratio:1;max-width:100%;border-radius:3px;background:var(--sunk);display:block}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--sunk))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 60%,var(--sunk))}
.heat i.l3{background:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-ui);font-size:10px}
.key{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.key i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.pcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.pcard .name{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.status{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-new{background:var(--err-soft);color:var(--err)} .st-train{background:var(--unn-soft);color:var(--unn)}
.st-impr{background:var(--accent-soft);color:var(--accent)} .st-done{background:var(--upg-soft);color:var(--upg)}
.bars{display:flex;gap:4px;align-items:flex-end;height:34px}
.bars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.bars i.zero{background:var(--line)}
.bars.spk i{background:var(--spk)} .bars.spk i.zero{background:var(--line)}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mrow:first-child{border-top:0}
.assess{font-family:var(--f-display);font-size:1.02rem;line-height:1.6;white-space:pre-wrap}
.empty{text-align:center;padding:26px 12px;display:flex;flex-direction:column;gap:8px;align-items:center}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);max-width:520px;width:100%}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.74rem;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.5s}.meter i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div><div class="brand">Native<span>Check</span></div><div class="level">C1 → C2 · <span id="variantLbl">British English</span></div></div>
    <button class="iconbtn" id="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div id="banners" class="stack"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="in">
  <button data-tab="practice" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>Üben</button>
  <button data-tab="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Sammlung</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-6"/></svg>Fortschritt</button>
</div></nav>

<script>
(function(){
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){ if(v==null||v===false)continue;
    if(k==="class")el.className=v; else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="html")el.innerHTML=v; else el.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat()){ if(c==null||c===false)continue; el.append(c instanceof Node?c:String(c)); }
  return el;}
const DAY=864e5;
const fmtDate=ts=>new Date(ts).toLocaleDateString("de-CH",{day:"numeric",month:"short"});
const fmtDT=ts=>new Date(ts).toLocaleString("de-CH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const words=t=>((t||"").match(/[A-Za-z’']+/g)||[]);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
const spinner=()=>h("span",{class:"spin","aria-hidden":"true"});
const SEV={error:{c:"err",l:"Fehler"},unnatural:{c:"unn",l:"Unnatürlich"},upgrade:{c:"upg",l:"Upgrade"},speech:{c:"spk",l:"Aussprache"}};
const CAT={grammar:"Grammatik",word_choice:"Wortwahl",collocation:"Kollokation",register:"Register / Ton",idiom:"Redewendung",spelling:"Rechtschreibung",punctuation:"Zeichensetzung",style:"Stil",pronunciation:"Aussprache",intonation:"Betonung / Melodie",fluency:"Flüssigkeit"};
const sevOf=i=>SEV[i.severity]||SEV.unnatural;
const fmtSec=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

const SCEN={
 everyday:[
  ["Absage","Du kannst am Samstag nicht zum Geburtstagsessen eines Freundes kommen. Sag ab, entschuldige dich und schlag etwas anderes vor."],
  ["Vermieter","Die Heizung in deiner Wohnung ist seit einer Woche kaputt. Beschwer dich höflich, aber bestimmt bei deinem Vermieter."],
  ["Smalltalk","Du bist auf einer Party. Erzähl jemandem Neuem, was du beruflich machst und was du letztes Wochenende erlebt hast."],
  ["Reklamation","Im Restaurant hast du das falsche Gericht bekommen und es ist kalt. Sprich es freundlich beim Kellner an."],
  ["Geplatzter Plan","Erzähl von einem Plan, der kurzfristig geplatzt ist, und wie du damit umgegangen bist."],
  ["Rat geben","Eine Freundin überlegt, ihren sicheren Job für ein Start-up zu kündigen. Gib ihr ehrlich deine Meinung."],
  ["Urlaub","Beschreib deinen letzten Urlaub: was großartig war und was richtig schiefging."]],
 business:[
  ["Deadline","Ein Projekt verzögert sich um eine Woche. Erklär es dem Kunden, ohne unprofessionell zu wirken."],
  ["Widersprechen","Im Meeting schlägt dein Chef eine Lösung vor, die du für falsch hältst. Widersprich höflich und begründe es."],

function parseJSON(t){ t=(t||"").trim(); try{return JSON.parse(t);}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{return JSON.parse(f[1]);}catch(e){} }
  const a=Math.min(...["{","["].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i;})); const b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));

  add(S.profile.model); (S.profile.models||[]).forEach(add); FALLBACK.forEach(add); return o; }
async function gemini(parts,{json=true,temperature=0.3,timeout=150000}={}){
  const key=(S.profile.apiKey||"").trim(); if(!key) throw {code:"no_key"};
  let lastErr={code:"other"};
  for(const m of modelOrder()){
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),timeout); let r;
    try{ r=await fetch(`${BASE}/models/${encodeURIComponent(m)}:generateContent`,{method:"POST",signal:ctl.signal,
        headers:{"Content-Type":"application/json","x-goog-api-key":key},
        body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:Object.assign({temperature},json?{responseMimeType:"application/json"}:{})})}); }
    catch(e){ clearTimeout(tm); throw {code:e&&e.name==="AbortError"?"timeout":"network"}; }
    clearTimeout(tm);
    if(r.ok){ const d=await r.json().catch(()=>({})); const c=d.candidates&&d.candidates[0];
      if(!c||!c.content){ lastErr={code:"blocked"}; continue; }
      const t=(c.content.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join("");
      if(!json) return t; try{ const v=parseJSON(t); if(S.profile.lastModel!==m) saveProfile({lastModel:m}); return v; }catch(e){ lastErr={code:"invalid_json"}; continue; } }
    const body=await r.json().catch(()=>({})); const msg=(body.error&&body.error.message)||"";
    if((r.status===400&&/api key|API_KEY/i.test(msg))||r.status===401||r.status===403) throw {code:"bad_key",message:msg};
    lastErr={code:r.status===429?"rate_limited":r.status===404?"no_model":r.status>=500?"server":"other",message:msg};
    if(r.status===429||r.status===404||r.status>=500) continue;
    throw lastErr;
  }
  throw lastErr;
}
async function discoverModels(key){
  const r=await fetch(`${BASE}/models?pageSize=200`,{headers:{"x-goog-api-key":key}});
  if(!r.ok){ const b=await r.json().catch(()=>({})); throw {code:(r.status===400||r.status===401||r.status===403)?"bad_key":"other",message:b.error&&b.error.message}; }
  const d=await r.json();
  const ms=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""))
    .filter(n=>/^gemini-\d/.test(n)&&/flash/.test(n)&&!/(tts|live|image|embed|transcrib|audio|translate|robotics|computer|thinking-exp|8b)/.test(n));
  const ver=n=>parseFloat((n.match(/^gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
  const score=n=>ver(n)*10-(/lite/.test(n)?3:0)-(/(preview|exp)/.test(n)?1.5:0)-(/-\d{2,}$/.test(n)?0.5:0);
  return [...new Set(ms)].sort((a,b)=>score(b)-score(a)).slice(0,6);
}

const ISSUE_SCHEMA=`{"original":"exact substring copied character-for-character from the learner's text, as short as possible (just the words concerned)","severity":"error|unnatural|upgrade","category":"grammar|word_choice|collocation|register|idiom|spelling|punctuation|style","correction":"replacement for exactly that substring","explanation":"German, 1-3 sentences: why","rule":"German, the general rule if there is one, otherwise null","germanism":"German, if the mistake comes from German, name the German source, otherwise null","pattern":"short German label for the underlying recurring problem, reusable across texts, e.g. 'since vs. for', 'Präpositionen bei Zeitangaben', 'Zu direkter Ton im Business', 'make vs. do', 'Artikel', 'Present Perfect vs. Simple Past', 'Satzstellung (deutsch gedacht)'","everyday":"how a native would say this part casually, or null","business":"how a native would say this part professionally, or null"}`;

const Rec={
  async start(){ const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC(); if(ctx.state==="suspended") await ctx.resume();
    const src=ctx.createMediaStreamSource(stream); const proc=ctx.createScriptProcessor(4096,1,1); const chunks=[];
    this.level=0; proc.onaudioprocess=e=>{ const d=e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); let s=0; for(let i=0;i<d.length;i+=8) s+=d[i]*d[i]; this.level=Math.sqrt(s/(d.length/8)); };
    src.connect(proc); proc.connect(ctx.destination);
    Object.assign(this,{stream,ctx,src,proc,chunks,t0:Date.now()}); },
  async stop(){ if(!this.ctx) return null; try{this.src.disconnect();this.proc.disconnect();}catch(e){} this.stream.getTracks().forEach(t=>t.stop());
    const rate=this.ctx.sampleRate; try{await this.ctx.close();}catch(e){}
    const len=this.chunks.reduce((t,c)=>t+c.length,0); const all=new Float32Array(len); let o=0; this.chunks.forEach(c=>{all.set(c,o);o+=c.length;});
    const pcm=downsample(all,rate,16000); const seconds=pcm.length/16000; this.ctx=null; this.chunks=[];
    return {blob:encodeWAV(pcm,16000),seconds}; },
  cancel(){ if(!this.ctx) return; try{this.src.disconnect();this.proc.disconnect();}catch(e){} this.stream.getTracks().forEach(t=>t.stop()); try{this.ctx.close();}catch(e){} this.ctx=null; this.chunks=[]; }};
function downsample(buf,from,to){ if(from===to) return buf; const ratio=from/to, n=Math.floor(buf.length/ratio), out=new Float32Array(n);
  for(let i=0;i<n;i++){ const a=Math.floor(i*ratio), b=Math.min(buf.length,Math.floor((i+1)*ratio)); let s=0; for(let j=a;j<b;j++) s+=buf[j]; out[i]=s/Math.max(1,b-a); } return out; }

  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,pcm.length*2,true);
  let peak=0; for(let i=0;i<pcm.length;i++) peak=Math.max(peak,Math.abs(pcm[i])); const gain=peak>0&&peak<0.5?0.9/peak:1;
  for(let i=0;i<pcm.length;i++){ const s=Math.max(-1,Math.min(1,pcm[i]*gain)); v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true); }
  return new Blob([b],{type:"audio/wav"}); }

function locate(text,issues){let pos=0;const placed=[],unplaced=[];
  const order=issues.map((it,i)=>i);
  order.forEach(i=>{const it=issues[i]; const o=(it.original||"").trim(); if(!o){unplaced.push(i);return;}
    let idx=text.indexOf(o,pos); if(idx<0)idx=text.indexOf(o); if(idx<0)idx=text.toLowerCase().indexOf(o.toLowerCase());
    if(idx<0||placed.some(p=>idx<p.end&&idx+o.length>p.start)){unplaced.push(i);return;}
    placed.push({start:idx,end:idx+o.length,i}); if(it.severity!=="speech") pos=idx+o.length;});
  placed.sort((a,b)=>a.start-b.start); return {placed,unplaced};}

        h("div",{class:"mrow"},h("span",null,"Wortvielfalt (verschiedene Wörter pro 100)"),h("span",null,(vNow?vNow.toFixed(0):"zu wenig Text")+(vPrev?"  ·  vorher "+vPrev.toFixed(0):""))),
        h("div",{class:"mrow"},h("span",null,"Redewendungen richtig benutzt (30 Tage)"),h("span",null,r30.idi+(p30.n?"  ·  vorher "+p30.idi:""))),
        h("div",{class:"mrow"},h("span",null,"Gesammelte Wendungen selbst benutzt"),h("span",null,S.phrases.filter(p=>p.used).length+" von "+S.phrases.length)))),
    h("section",{class:"stack"},h("h3",null,"Deine Problemfelder"),pcards),
    h("section",{class:"panel"},h("h3",null,"Lieblingswörter"),h("p",{class:"small muted"},"Wörter, die du oft benutzt, pro 1000 Wörter (30 Tage). Hier lohnt sich mehr Vielfalt."),
      over.length?h("div",null,over.map(o=>{const pv=oPrev.list.find(x=>x.w===o.w); return h("div",{class:"mrow"},h("span",{style:"font-family:var(--f-display);font-weight:600"},o.w),h("span",null,o.per.toFixed(1)+(oPrev.total?"  ·  vorher "+pv.per.toFixed(1):"")));})):h("p",{class:"small"},"Nichts Auffälliges. Gut so.")),
    h("section",{class:"panel"},h("h3",null,"Persönliche Einschätzung"),assessOut,h("div",null,aBtn),aSt));
}

/* ================= boot ================= */
async function boot(){
  render();
  await Store.open();
  const [ss,ph,pr]=await Promise.all([Store.get("sessions"),Store.get("phrases"),Store.get("profile")]);
  if(Array.isArray(ss)) S.sessions=ss.sort((a,b)=>b.ts-a.ts); if(Array.isArray(ph)) S.phrases=ph; if(pr) S.profile=Object.assign(S.profile,pr);
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const b=$("#banners"); b.replaceChildren();
  if(!Store.db) b.append(h("div",{class:"banner"},"Dein Browser erlaubt hier keine Datenbank. Übungen werden eingeschränkt gespeichert, Aufnahmen gar nicht."));
  if(location.protocol==="file:") b.append(h("div",{class:"banner"},"Die App läuft als lokale Datei. Für Mikrofon und Homescreen musst du sie über https öffnen (siehe Anleitung)."));
  render();
  if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
}
window.addEventListener("pageshow",e=>{ if(e.persisted) render(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&S.rec){ /* keep recording; iOS may pause it */ } });
boot();
})();
</script>
